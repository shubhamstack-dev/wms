server {
  listen 80;
  root /usr/share/nginx/html;
  client_max_body_size 50m;            # legacy JSON imports can be large

  # Docker's DNS. Looking the backend up on every request (instead of once at
  # start-up) avoids 502s after a deploy recreates the backend with a new IP.
  resolver 127.0.0.11 valid=10s ipv6=off;

  location /api/ {                     # React -> Python middleware
    # wms-backend, not "backend": on the server this container also sits on the
    # ProjectSystem network, which has its own service called backend
    set $wms_api wms-backend:8000;
    proxy_pass http://$wms_api;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_read_timeout 120s;
  }
  location /assets/ { expires 30d; add_header Cache-Control "public, immutable"; }
  location / { try_files $uri /index.html; }   # client-side routing
}
