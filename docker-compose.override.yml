# Local development only. Docker Compose loads this file automatically when you
# run plain `docker compose up`. The server never uses it (it passes -f files),
# so MySQL and the raw API are never exposed to the internet.
services:
  mysql:
    ports:
      - "3306:3306"
  backend:
    ports:
      - "8000:8000"          # API + interactive docs at http://localhost:8000/docs
